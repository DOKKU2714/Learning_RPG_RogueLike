<script>
(function(global) {
  'use strict';

  var scheduled = false;
  var playPermissionHookInstalled = false;
  var playPermissionModal = null;

  function removeAdminButtons() {
    var adminButton = document.getElementById('adminButton');
    if (adminButton) {
      adminButton.style.display = 'none';
      adminButton.disabled = true;
      adminButton.setAttribute('aria-hidden', 'true');
    }

    Array.prototype.forEach.call(document.querySelectorAll('button'), function(button) {
      var text = String(button.textContent || '').replace(/\s+/g, ' ').trim();
      if ((text === '관리자 접속' || text === '관리자') && button.id !== 'adminButton' && button.parentNode) {
        button.parentNode.removeChild(button);
      }
    });
  }

  function getSelectedWorkbook() {
    var state = global.currentState || null;
    var workbook = state && state.selectedWorkbook || null;
    var workbookId = '';
    try { workbookId = sessionStorage.getItem('learningRpgSelectedWorkbookId') || ''; } catch (error) {}
    if (!workbook && state && Array.isArray(state.activeWorkbooks)) {
      workbook = state.activeWorkbooks.filter(function(item) {
        return String(item.workbookId || '').trim() === String(workbookId || state.selectedWorkbookId || '').trim();
      })[0] || null;
    }
    return workbook;
  }

  function addWorkbookManagementButton(questionCreateButton) {
    var state = global.currentState || null;
    var player = state && state.player || null;
    var isTeacher = !!player && String(player.role || '').trim() === 'teacher';
    var button = document.getElementById('workbookManagementButton');
    if (!isTeacher) {
      if (button && button.parentNode) button.parentNode.removeChild(button);
      return;
    }
    if (!button) {
      button = document.createElement('button');
      button.id = 'workbookManagementButton';
      button.className = 'secondary';
      button.setAttribute('data-main-navigation', 'true');
      button.type = 'button';
      button.textContent = '문제집 관리';
      button.addEventListener('click', function(event) {
        if (event) { event.preventDefault(); event.stopPropagation(); }
        var base = (typeof WEB_APP_URL !== 'undefined' && WEB_APP_URL) ? WEB_APP_URL : global.location.href.split('?')[0];
        var nextUrl = base + '?page=workbookmanagement&skipIntro=1';
        if (typeof global.showLoadingModal === 'function') global.showLoadingModal('문제집 관리로 이동 중...', '문제집 관리 화면을 준비하는 중입니다.');
        global.setTimeout(function() {
          if (typeof global.navigateTop === 'function') global.navigateTop(nextUrl);
          else { try { global.top.location.assign(nextUrl); } catch (error) { global.location.href = nextUrl; } }
        }, 60);
      });
      questionCreateButton.parentNode.insertBefore(button, questionCreateButton);
    }
    button.classList.remove('hidden');
    button.style.display = '';
    button.disabled = false;
  }

  function refreshQuestionManagementButton() {
    removeAdminButtons();
    var questionCreateButton = document.getElementById('questionCreateButton');
    if (!questionCreateButton || !questionCreateButton.parentNode) return;
    addWorkbookManagementButton(questionCreateButton);
    var state = global.currentState || null;
    var player = state && state.player || null;
    var workbook = getSelectedWorkbook();
    var isOwner = !!(player && workbook && String(player.playerId || '').trim() && String(player.playerId || '').trim() === String(workbook.createdBy || '').trim());
    var managementButton = document.getElementById('questionManagementButton');
    if (!isOwner) {
      if (managementButton && managementButton.parentNode) managementButton.parentNode.removeChild(managementButton);
      return;
    }
    if (!managementButton) {
      managementButton = document.createElement('button');
      managementButton.id = 'questionManagementButton';
      managementButton.className = 'secondary';
      managementButton.setAttribute('data-main-navigation', 'true');
      managementButton.type = 'button';
      managementButton.textContent = '문제 관리';
      managementButton.addEventListener('click', function() {
        var base = (typeof WEB_APP_URL !== 'undefined' && WEB_APP_URL) ? WEB_APP_URL : global.location.href.split('?')[0];
        global.location.href = base + '?page=questionmanagement&skipIntro=1';
      });
      questionCreateButton.parentNode.insertBefore(managementButton, questionCreateButton.nextSibling);
    }
    managementButton.classList.remove('hidden');
    managementButton.style.display = '';
    managementButton.disabled = false;
  }

  function ensurePlayPermissionModal() {
    if (playPermissionModal && playPermissionModal.parentNode) return playPermissionModal;
    var style = document.createElement('style');
    style.id = 'learningRpgPlayPermissionModalStyle';
    style.textContent = '#learningRpgPlayPermissionModal{position:fixed;inset:0;z-index:100000;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.78);font-family:"Galmuri11","DungGeunMo","NeoDunggeunmo","Apple SD Gothic Neo","Malgun Gothic",monospace;}#learningRpgPlayPermissionModal.open{display:grid;}#learningRpgPlayPermissionModal .panel{width:min(430px,92vw);padding:28px 24px 22px;border:2px solid #777;background:#171717;box-shadow:inset -3px -3px 0 #080808,0 18px 50px rgba(0,0,0,.65);color:#ededed;text-align:center;}#learningRpgPlayPermissionModal h2{margin:0 0 14px;font-size:22px;}#learningRpgPlayPermissionModal p{margin:0 0 22px;color:#c8c8c8;line-height:1.7;white-space:pre-wrap;}#learningRpgPlayPermissionModal button{min-width:120px;}';
    document.head.appendChild(style);
    playPermissionModal = document.createElement('div');
    playPermissionModal.id = 'learningRpgPlayPermissionModal';
    playPermissionModal.setAttribute('role', 'dialog');
    playPermissionModal.setAttribute('aria-modal', 'true');
    playPermissionModal.innerHTML = '<section class="panel"><h2>게임 시작 불가</h2><p>현재는 게임 시작이 불가능합니다.</p><button type="button" id="learningRpgPlayPermissionConfirm">확인</button></section>';
    document.body.appendChild(playPermissionModal);
    document.getElementById('learningRpgPlayPermissionConfirm').addEventListener('click', function() {
      playPermissionModal.classList.remove('open');
      playPermissionModal.setAttribute('aria-hidden', 'true');
      if (typeof global.resetMainNavigation === 'function') global.resetMainNavigation();
      var base = (typeof WEB_APP_URL !== 'undefined' && WEB_APP_URL) ? WEB_APP_URL : global.location.href.split('?')[0];
      var nextUrl = base + '?skipIntro=1';
      if (typeof global.showLoadingModal === 'function') global.showLoadingModal('메인 화면으로 이동 중...', '잠시만 기다려 주세요.');
      global.setTimeout(function() {
        if (typeof global.navigateTop === 'function') global.navigateTop(nextUrl);
        else { try { global.top.location.assign(nextUrl); } catch (error) { global.location.href = nextUrl; } }
      }, 60);
    });
    return playPermissionModal;
  }

  function showPlayPermissionModal() { ensurePlayPermissionModal().classList.add('open'); }

  function installPlayPermissionHook() {
    if (playPermissionHookInstalled) return;
    if (typeof global.showGameStartMessage !== 'function') { global.setTimeout(installPlayPermissionHook, 0); return; }
    var original = global.showGameStartMessage;
    if (original.__learningRpgPlayPermissionWrapped) { playPermissionHookInstalled = true; return; }
    document.addEventListener('click', function(event) {
      var target = event.target;
      if (!target || !target.closest) return;
      var button = target.closest('button[data-main-navigation="true"]');
      if (!button) return;
      var text = String(button.textContent || '').replace(/\s+/g, ' ').trim();
      if (text !== '게임 시작') return;
      var state = global.currentState || null;
      var player = state && state.player || null;
      var isTeacher = !!player && String(player.role || '').trim() === 'teacher';
      if (isTeacher) return;
      var workbookId = '';
      try { workbookId = sessionStorage.getItem('learningRpgSelectedWorkbookId') || ''; } catch (error) {}
      workbookId = String(workbookId || '').trim();
      if (!workbookId || typeof google === 'undefined' || !google.script || !google.script.run) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      google.script.run
        .withSuccessHandler(function(result) {
          if (!result || result.allowed !== true) {
            if (typeof global.resetMainNavigation === 'function') global.resetMainNavigation();
            showPlayPermissionModal();
            return;
          }
          original.call(button, button);
        })
        .withFailureHandler(function() {
          if (typeof global.resetMainNavigation === 'function') global.resetMainNavigation();
          showPlayPermissionModal();
        })
        .canStartWorkbookPlay(getAuthTokenSafe(), workbookId);
    }, true);
    playPermissionHookInstalled = true;
  }

  function getAuthTokenSafe() { try { return sessionStorage.getItem('learningRpgAuthToken') || ''; } catch (error) { return ''; } }

  function scheduleRefresh() {
    if (scheduled) return;
    scheduled = true;
    var run = function() { scheduled = false; refreshQuestionManagementButton(); installPlayPermissionHook(); };
    if (global.requestAnimationFrame) global.requestAnimationFrame(run); else global.setTimeout(run, 0);
  }

  function start() {
    refreshQuestionManagementButton();
    installPlayPermissionHook();
    if (global.MutationObserver && document.body) {
      var observer = new MutationObserver(function() { scheduleRefresh(); });
      observer.observe(document.body, { childList: true, subtree: true });
    }
    var attempts = 0;
    var timer = global.setInterval(function() {
      attempts += 1;
      refreshQuestionManagementButton();
      installPlayPermissionHook();
      if (attempts >= 120) global.clearInterval(timer);
    }, 250);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})(window);
</script>
