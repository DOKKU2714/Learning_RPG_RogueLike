<style>
  @import url("https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css");

  .combat-choice-dialog { color: #ecf0f6; background: #192334; border: 1px solid #69809b; border-radius: 12px; max-width: min(90vw, 480px); padding: 22px; }
  .combat-choice-dialog::backdrop { background: #0009; }
  .combat-choice-dialog button { display: block; width: 100%; padding: 12px; margin-top: 10px; cursor: pointer; border-radius: 8px; }
  :root {
    --bg: #141414;
    --bg-soft: #1c1c1c;
    --panel: #202020;
    --panel-2: #292929;
    --text: #ededed;
    --muted: #a9a9a9;
    --line: #777;
    --line-dark: #3c3c3c;
    --accent: #d8d8d8;
    --danger: #b94a48;
    --ok: #5f9b6e;
    --warn: #bda76a;
    --shadow: rgba(0, 0, 0, 0.58);
    --font-pixel: "Galmuri11", "DungGeunMo", "NeoDunggeunmo", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
    --font-readable: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    min-height: 100%;
  }

  body {
    margin: 0;
    color: var(--text);
    background: var(--bg);
    font-family: var(--font-pixel);
    font-size: 15px;
    line-height: 1.55;
    letter-spacing: 0;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  button {
    min-height: 42px;
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 10px 16px;
    color: var(--text);
    background: #242424;
    cursor: pointer;
    box-shadow: inset 0 0 0 1px #111;
  }

  button:hover:not(:disabled),
  button:focus-visible {
    background: #333;
    outline: 1px solid var(--accent);
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  button.secondary {
    color: var(--text);
    background: #181818;
  }

  button.danger {
    color: #fff;
    border-color: #6c1d1d;
    background: #8f1d1d;
  }

  button.danger:hover:not(:disabled),
  button.danger:focus-visible {
    background: #a52a2a;
  }

  .sound-toggle-button,
  .menu-logout-button {
    width: 40px;
    height: 40px;
    min-height: 40px;
    display: inline-grid;
    place-items: center;
    border: 1px solid rgba(220, 220, 220, 0.72);
    padding: 0;
    color: #f0f0f0;
    background: rgba(8, 8, 8, 0.78);
    box-shadow: inset -2px -2px 0 rgba(0, 0, 0, 0.62), 0 10px 28px rgba(0, 0, 0, 0.42);
  }

  .sound-toggle-button svg,
  .menu-logout-button svg {
    width: 22px;
    height: 22px;
    display: block;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .sound-toggle-button .sound-icon-off,
  .sound-toggle-button.sound-muted .sound-icon-on {
    display: none;
  }

  .sound-toggle-button.sound-muted .sound-icon-off {
    display: block;
  }

  .menu-sound-toggle {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 20;
  }

  .menu-logout-button {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 20;
  }

  .battle-sound-toggle {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 7;
  }

  .sound-volume-panel { position: fixed; z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 72px; box-sizing: border-box; padding: 12px 8px; border: 1px solid #b4a272; border-radius: 4px; background: #171713f5; color: #fff0cb; box-shadow: 0 8px 24px #0009; font-size: 12px; }
  .sound-volume-panel[hidden] { display: none; }
  .sound-volume-panel input[type="range"] { writing-mode: vertical-lr; direction: rtl; appearance: auto; width: 28px; height: 140px; min-height: 140px; padding: 0; margin: 0; border: 0; background: transparent; accent-color: #e9cd82; cursor: pointer; touch-action: none; }
  .sound-volume-panel output { font: bold 12px/1.4 Arial, sans-serif; }

  input,
  select,
  textarea {
    width: 100%;
    min-height: 42px;
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 10px;
    color: var(--text);
    background: #101010;
  }

  .difficulty-select {
    color: #ffd84a;
    font-weight: 900;
    letter-spacing: 0;
  }

  textarea {
    min-height: 112px;
    resize: vertical;
  }

  label {
    display: block;
    margin: 0 0 8px;
    color: var(--accent);
    font-weight: 700;
  }

  h1,
  h2,
  h3,
  p {
    margin-top: 0;
  }

  .screen {
    display: none;
  }

  .screen.active {
    display: block;
  }

  .app-shell {
    min-height: 100vh;
    padding: 24px;
    background:
      radial-gradient(circle at 50% 30%, rgba(255,255,255,0.05), transparent 34%),
      var(--bg);
  }

  .menu-shell {
    width: min(520px, 100%);
    min-height: 100vh;
    margin: 0 auto;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .rpg-panel {
    width: 100%;
    border: 1px solid var(--line);
    background: rgba(28, 28, 28, 0.96);
    box-shadow: 0 12px 40px var(--shadow), inset 0 0 0 1px #080808;
    padding: 20px;
  }

  .rpg-title {
    margin: 0 0 18px;
    text-align: center;
    font-size: 28px;
    font-weight: 700;
  }

  .muted {
    color: var(--muted);
  }

  .message {
    min-height: 24px;
    margin-top: 12px;
    font-weight: 700;
  }

  .message.error {
    color: #e18b87;
  }

  .message.ok {
    color: #9bc9a6;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .account-role-options {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
  }

  .account-role-option {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 0;
    line-height: 1;
  }

  .account-role-option input[type="radio"],
  .account-role-option input[type="checkbox"] {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    min-height: 0;
    margin: 0;
    padding: 0;
    accent-color: var(--accent);
  }

  .choice-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .vertical-menu {
    display: grid;
    gap: 12px;
    margin: 18px auto 0;
    width: min(340px, 100%);
  }

  .vertical-menu button {
    width: 100%;
    text-align: center;
  }

  .inline-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .hidden {
    display: none !important;
  }

  .intro-screen {
    min-height: 100vh;
    display: none;
    place-items: center;
    padding: 24px;
    text-align: center;
    color: var(--text);
    background: #151515;
    cursor: pointer;
  }

  .intro-screen.active {
    display: grid;
  }

  .intro-logo {
    width: min(760px, 94vw);
    min-height: 240px;
    display: grid;
    place-items: center;
    border: 0;
    background: transparent;
    box-shadow: none;
    margin-bottom: 28px;
    font-size: 34px;
    font-weight: 700;
  }

  .intro-logo.intro-logo-image {
    position: relative;
    overflow: hidden;
    background: transparent;
  }

  .intro-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .intro-logo #introLogoFallback {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    white-space: normal;
  }

  .intro-logo.logo-loaded #introLogoFallback {
    display: none;
  }

  .main-menu-logo {
    width: min(360px, 92%);
    min-height: 92px;
    display: grid;
    place-items: center;
    margin: 0 auto 16px;
  }

  .main-menu-logo img {
    width: 100%;
    max-height: 140px;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 4px 0 #000);
  }

  .blink-text {
    animation: slowBlink 2.4s ease-in-out infinite;
    color: var(--muted);
  }

  @keyframes slowBlink {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 1; }
  }

  .fade-in {
    animation: fadeIn 180ms ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .battle-shell {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 14px;
    padding: 18px;
    background:
      linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.78)),
      #151515;
  }

  .battle-topbar {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    color: var(--muted);
  }

  .battle-stage {
    position: relative;
    min-height: 430px;
    border: 1px solid var(--line-dark);
    background:
      radial-gradient(ellipse at center, rgba(110,110,110,0.13), transparent 34%),
      linear-gradient(to bottom, #202020, #121212 64%, #0d0d0d);
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr;
    padding: 18px;
  }

  .monster-hud {
    width: min(480px, 88%);
    margin: 0 auto;
    display: grid;
    gap: 8px;
  }

  .thin-hp-bar {
    position: relative;
    height: 10px;
    border: 1px solid #bfbfbf;
    background: #080808;
    overflow: hidden;
  }

  .thin-hp-bar > span,
  .meter-fill {
    display: block;
    height: 100%;
    width: 0%;
    background: #bdbdbd;
    transition: width 420ms ease-out, left 420ms ease-out;
  }

  .status-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    min-height: 28px;
  }

  .status-icon {
    position: relative;
    min-width: 26px;
    height: 26px;
    padding: 0 4px;
    display: inline-grid;
    place-items: center;
    border: 2px solid var(--line);
    color: var(--accent);
    background: #111;
    font-family: var(--font-pixel);
    font-size: 10px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0.04em;
    box-shadow: inset -2px -2px 0 rgba(0, 0, 0, 0.55);
  }

  .status-turns {
    position: absolute;
    right: -4px;
    bottom: -5px;
    min-width: 12px;
    height: 12px;
    display: grid;
    place-items: center;
    border: 1px solid #080808;
    background: #e8e8e8;
    color: #050505;
    font-family: Arial, sans-serif;
    font-style: normal;
    font-size: 8px;
    font-weight: 800;
    line-height: 1;
  }

  .status-icon.buff {
    border-color: #43c46f;
    color: #7ee29a;
    box-shadow: 0 0 10px rgba(67, 196, 111, 0.2);
  }

  .status-icon.debuff {
    border-color: #d94b4b;
    color: #ff8b8b;
    box-shadow: 0 0 10px rgba(217, 75, 75, 0.2);
  }

  .monster-area {
    display: grid;
    place-items: center;
    padding: 24px 0 12px;
  }

  .monster-sprite-placeholder {
    width: min(300px, 62vw);
    aspect-ratio: 1 / 1.05;
    border: 2px solid var(--line);
    background:
      radial-gradient(circle at 50% 35%, #2e2e2e, #181818 62%, #101010);
    display: grid;
    place-items: center;
    color: var(--muted);
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
  }

  .monster-name {
    margin-top: 12px;
    text-align: center;
    color: var(--accent);
    font-size: 20px;
  }

  .intent-box {
    position: absolute;
    right: 18px;
    top: 78px;
    min-width: 120px;
    border: 1px solid var(--line);
    background: rgba(15, 15, 15, 0.88);
    padding: 8px;
    color: var(--muted);
  }

  .battle-bottom {
    display: grid;
    grid-template-columns: minmax(220px, 0.8fr) minmax(280px, 1.6fr);
    gap: 14px;
  }

  .action-panel,
  .log-panel,
  .player-panel {
    border: 1px solid var(--line);
    background: rgba(20, 20, 20, 0.96);
    box-shadow: inset 0 0 0 1px #090909;
    padding: 14px;
  }

  .action-panel {
    display: grid;
    gap: 8px;
  }

  .log-panel {
    min-height: 132px;
  }

  .battle-log {
    min-height: 82px;
    line-height: 1.7;
    color: var(--accent);
  }

  .player-panel {
    grid-column: 1 / -1;
  }

  .player-status-line {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: center;
  }

  .meter {
    height: 12px;
    border: 1px solid var(--line);
    background: #080808;
  }

  .meter-fill.hp {
    background: #a7a7a7;
  }

  .question-modal-overlay,
  .loading-overlay {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    padding: 20px;
    background: rgba(0, 0, 0, 0.76);
    z-index: 20;
    transition: background 650ms ease, opacity 650ms ease;
  }

  .question-modal-overlay.active,
  .loading-overlay.active {
    display: grid;
  }

  .question-modal,
  .loading-box {
    width: min(720px, 100%);
    border: 1px solid var(--line);
    background: #1a1a1a;
    box-shadow: 0 22px 80px rgba(0,0,0,0.7), inset 0 0 0 1px #080808;
    padding: 18px;
    transition: opacity 180ms ease, transform 180ms ease;
  }

  .question-modal {
    width: min(880px, 100%);
    padding: 20px 22px 18px;
    min-height: 0;
    max-height: calc(100vh - 40px);
    max-height: calc(100dvh - 40px);
    overflow-y: auto;
    overscroll-behavior-y: contain;
  }

  #questionModal .question-submit-actions {
    position: sticky;
    bottom: 0;
    z-index: 8;
    padding-top: 10px;
    background: #1a1a1a;
    box-shadow: 0 -8px 12px #1a1a1a;
  }

  @media (min-width: 901px) and (max-height: 900px) {
    #questionModal .question-prompt-panel {
      min-height: 150px;
      padding: 44px 28px 18px;
    }

    #questionModal .question-prompt-panel h2 {
      margin-bottom: 14px;
      font-size: 34px;
    }

    #questionModal .question-answer-panel {
      min-height: 0;
      padding: 16px 28px;
    }
  }

  .loading-overlay.page-transition {
    background: #000;
  }

  .loading-overlay.opaque-background {
    background: #000;
    transition: none;
  }

  .loading-overlay.page-transition .loading-box {
    opacity: 0;
    transform: translateY(12px) scale(0.98);
  }

  .loading-text {
    display: none;
  }

  .loading-progress {
    width: min(420px, 100%);
    height: 10px;
    margin: 8px auto 6px;
    border: 1px solid var(--line-dark);
    background: #090909;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    overflow: hidden;
  }

  .loading-progress span {
    display: block;
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #ffd83d, #8fd1ff);
    transition: width 260ms ease;
  }

  .loading-meta {
    width: min(420px, 100%);
    margin: 0 auto 8px;
    display: flex;
    justify-content: space-between;
    color: #cfcfcf;
    font-size: 12px;
  }

  .loading-overlay.no-progress .loading-progress,
  .loading-overlay.no-progress .loading-meta {
    display: none;
  }

  .loading-steps {
    width: min(420px, 100%);
    margin: 10px auto 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 6px;
    color: #8f8f8f;
    font-size: 13px;
  }

  .loading-steps.hidden {
    display: none;
  }

  .loading-steps li {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .loading-steps li::before {
    content: '';
    width: 7px;
    height: 7px;
    border: 1px solid #777;
    background: #111;
  }

  .loading-steps li.active {
    color: #fff0b8;
  }

  .loading-steps li.active::before {
    border-color: #ffd83d;
    background: #ffd83d;
    box-shadow: 0 0 8px rgba(255, 216, 61, 0.6);
  }

  .loading-steps li.done {
    color: #b7d8ff;
  }

  .loading-steps li.done::before {
    border-color: #8fd1ff;
    background: #8fd1ff;
  }

  .modal-topline {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }

  .creator-badge {
    display: inline-flex;
    align-items: center;
    min-height: 30px;
    border: 1px solid var(--warn);
    color: #f0dfaa;
    background: #332b16;
    padding: 4px 10px;
    white-space: nowrap;
  }

  .question-frame {
    position: relative;
    border: 2px solid var(--line);
    background: #111;
  }

  .question-prompt-panel {
    min-height: 190px;
    display: grid;
    place-items: center;
    padding: 52px 42px 34px;
    margin-bottom: 12px;
  }

  .question-prompt-panel h2 {
    margin: 0 0 22px;
    font-size: clamp(30px, 5vw, 44px);
    line-height: 1.05;
    text-align: center;
  }

  .question-prompt-panel p {
    margin: 0;
    width: 100%;
    line-height: 1.65;
    text-align: center;
    font-size: 17px;
  }

  #questionTitle,
  #questionPrompt,
  #questionAnswerArea,
  #questionMessage {
    font-family: var(--font-readable);
  }

  .question-metadata {
    width: min(620px, 100%);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin: -10px 0 16px;
  }

  .question-meta-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    max-width: 180px;
    border: 1px solid rgba(220, 220, 220, 0.38);
    background: rgba(255, 255, 255, 0.07);
    color: #cfcfcf;
    padding: 3px 7px;
    font-size: 11px;
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .question-meta-chip b {
    color: #f0dfaa;
    font-weight: 800;
  }

  .question-answer-panel {
    min-height: 230px;
    display: grid;
    place-items: center;
    padding: 28px 36px;
  }

  .question-answer-panel #questionAnswerArea {
    width: min(620px, 100%);
  }

  .question-corner-badge {
    position: absolute;
    top: -2px;
    min-height: 36px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 2px solid var(--line);
    background: #1a1a1a;
    padding: 4px 14px;
    font-size: 18px;
    line-height: 1;
    z-index: 2;
  }

  .question-difficulty-badge {
    left: -2px;
  }

  .question-difficulty-badge span {
    font-weight: 900;
  }

  .difficulty-stars {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    color: #ffd84a;
    font-size: 18px;
    line-height: 1;
    text-shadow: 0 1px 0 #2b1c00, 0 0 10px rgba(255, 216, 74, 0.42);
  }

  .difficulty-star {
    display: inline-block;
  }

  .question-prompt-panel .creator-badge {
    right: -2px;
    color: #f0dfaa;
  }

  .question-reaction-bar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin: -2px 0 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .question-accuracy { margin-right: auto; color: #f0dfaa; font-size: 13px; }
  .question-understanding { flex: 1 1 0; min-width: 0; }
  .question-understanding-label { display: block; margin-bottom: 7px; font-size: 13px; color: #e8e8e8; }
  .question-understanding-buttons { display: flex; flex-wrap: wrap; gap: 5px; }
  .question-understanding-buttons button { flex: 1 1 100px; min-height: 36px; padding: 7px 5px; font-size: 11px; background: #101010; color: #d9d9d9; border: 1px solid #666; }
  .question-understanding-buttons button.selected { border-color: #84baff; background: #20384e; color: #fff; }
  .question-understanding-status { display: block; min-height: 16px; margin-top: 5px; font-size: 11px; color: #aacfff; }
  .question-understanding-status:empty { display: none; }
  #questionModal .question-submit-actions { align-items: flex-end; flex-wrap: wrap; }

  .question-reaction-button {
    position: relative;
    min-height: 34px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--line-dark);
    padding: 6px 12px;
    background: #101010;
    color: #e8e8e8;
    font-size: 13px;
    box-shadow: inset -2px -2px 0 rgba(0, 0, 0, 0.45);
    overflow: visible;
  }

  .question-reaction-button strong {
    min-width: 18px;
    text-align: right;
    font-size: 14px;
  }

  .question-like-button {
    border-color: rgba(80, 150, 255, 0.64);
    color: #bcd8ff;
  }

  .question-like-button:hover:not(:disabled),
  .question-like-button:focus-visible,
  .question-like-button.selected {

  @keyframes reward-window-enter {

  @keyframes reward-card-materialize {

  @keyframes reward-content-reveal {

    100% { visibility: visible; opacity: 1; }
  }
  @keyframes reward-charge-grow {
    0% { scale: .22; opacity: .4; }
    45% { opacity: .75; }

  }
  @keyframes reward-charge-vibrate {
    0%, 100% { translate: 0 0; }
    25% { translate: calc(0px - var(--reward-shake)) calc(var(--reward-shake) * .4); }
    50% { translate: var(--reward-shake) calc(var(--reward-shake) * -.4); }

  @keyframes reward-charge-extinguish {

  @keyframes reward-spectrum-turn {

  }
  @keyframes reward-card-rarity-flash {
    0%, 36% { opacity: 1; }
    46%, 100% { opacity: 0; }
  }
  @keyframes reward-charge-tint {
    from { opacity: 0; }
    to { opacity: .65; }
  }
  @keyframes reward-star-tint {
    from { background-color: #fff; }
    to { background-color: var(--reward-gem-color); }

  @keyframes reward-flash-envelope {
    0% { opacity: 0; }
    6%, 48% { opacity: 1; }
    62% { opacity: .9; }
    82% { opacity: .4; }
    100% { opacity: 0; visibility: hidden; }

  /* Matching polygon vertices let the pointed cross continuously unfold into a card. */
  @keyframes reward-light-card-morph {
    0% {
      clip-path: polygon(50% 0%, 52% 44%, 56% 48%, 100% 50%, 56% 52%, 52% 56%, 50% 100%, 48% 56%, 44% 52%, 0% 50%, 44% 48%, 48% 44%);
      transform: scale(.12);
    }
    11% {
      clip-path: polygon(50% 0%, 52% 44%, 56% 48%, 100% 50%, 56% 52%, 52% 56%, 50% 100%, 48% 56%, 44% 52%, 0% 50%, 44% 48%, 48% 44%);
      transform: scale(calc(.52 + var(--reward-flash-scale) * .14));
    }
    29%, 36% {
      clip-path: polygon(50% 0%, 100% 0%, 100% 0%, 100% 50%, 100% 100%, 100% 100%, 50% 100%, 0% 100%, 0% 100%, 0% 50%, 0% 0%, 0% 0%);
      transform: scale(1.025);
      animation-timing-function: cubic-bezier(.6,0,.85,.25);
    }
    46%, 100% {
      clip-path: polygon(50% 0%, 100% 0%, 100% 0%, 100% 50%, 100% 100%, 100% 100%, 50% 100%, 0% 100%, 0% 100%, 0% 50%, 0% 0%, 0% 0%);
      transform: scale(.035);

  @keyframes reward-collapse-afterglow {
    0%, 35% { opacity: 0; transform: scale(1.3); }
    46% { opacity: 1; transform: scale(1); }
    62% { opacity: .85; }
    100% { opacity: 0; transform: scale(.35); }

  @keyframes reward-dust-drift {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); }

  @keyframes reward-light-sweep {
    0% { background-position: 100% 0; opacity: 0; }
    12% { opacity: var(--reward-radiance); }
    36% { background-position: 0 0; opacity: 0; }
    100% { background-position: 0 0; opacity: 0; }

  .compact-actions > .combat-icon-button { position: relative; min-height: 48px; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg,#343733,#191c19); border-color: #6e7763; box-shadow: inset 0 2px 0 #ffffff15,0 2px 3px #0008; }
