<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <?!= include_('UiStyles'); ?>
  <style>
    .qm{max-width:1180px;margin:0 auto;padding:22px 14px 50px}.qm-head,.qm-tools,.qm-summary,.qm-row{display:flex;align-items:center;gap:12px}.qm-head{justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.qm-tools{flex-wrap:wrap;padding:12px;margin:14px 0;border:1px solid var(--line);background:rgba(10,10,10,.94)}.qm-tools>*{flex:1 1 140px}.qm-tools .search{flex:3 1 280px}.qm-tools button{flex:0 0 auto}.qm-summary{justify-content:space-between;flex-wrap:wrap;margin:10px 0}.qm-list{display:grid;gap:7px}.qm-item{border:1px solid var(--line);background:#0d0d0d;overflow:hidden}.qm-item.open{border-color:rgba(217,166,66,.7)}.qm-row{padding:12px 14px;cursor:pointer}.qm-main{min-width:0;flex:1}.qm-title{margin:0;font-size:15px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qm-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px;color:var(--muted);font-size:12px}.qm-stars{white-space:nowrap;color:#d9a642;font-size:17px;letter-spacing:-2px}.qm-actions{display:flex;gap:6px}.qm-actions button{min-height:34px;padding:5px 10px}.qm-detail{display:none;border-top:1px solid var(--line-dark);padding:14px}.qm-item.open .qm-detail{display:block}.qm-detail-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}.qm-label{font-size:11px;font-weight:800;color:var(--accent);margin-bottom:5px}.qm-content{white-space:pre-wrap;word-break:break-word;line-height:1.55}.qm-choices{display:grid;gap:6px}.qm-choice{padding:7px 9px;border:1px solid var(--line-dark)}.qm-choice.correct{border-color:rgba(217,166,66,.7);color:var(--accent)}.qm-modal-bg{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.78)}.qm-modal-bg.open{display:flex}.qm-modal{width:min(760px,100%);max-height:calc(100vh - 36px);overflow:auto}.qm-form{display:grid;gap:11px;margin:14px 0}.qm-form textarea{min-height:90px}.qm-modal-actions{display:flex;justify-content:flex-end;gap:8px}.qm-empty{padding:38px 18px;border:1px dashed var(--line);text-align:center;color:var(--muted)}.danger{color:#ffb2a8;border-color:rgba(255,100,80,.45)}@media(max-width:720px){.qm-detail-grid{grid-template-columns:1fr}.qm-row{align-items:flex-start;flex-wrap:wrap}.qm-actions{width:100%;justify-content:flex-end}.qm-title{white-space:normal}.qm-stars{margin-left:auto}}
  </style>
</head>
<body>
<main class="qm fade-in">
  <section class="rpg-panel">
    <div class="qm-head"><div><h1 class="rpg-title" style="margin-bottom:5px">문제 관리</h1><p id="qmWorkbook" class="muted">불러오는 중...</p></div><div><button class="secondary" onclick="loadQuestions()">↻ 새로고침</button> <button class="secondary" onclick="goHome()">메인으로</button></div></div>
  </section>
  <section class="rpg-panel qm-tools">
    <input id="qmSearch" class="search" type="search" placeholder="문제, 작성자, 과목, 단원, 태그 검색" oninput="render()">
    <select id="qmDifficulty" onchange="render()"><option value="">난이도 전체</option><option value="1">★ 1</option><option value="2">★★ 2</option><option value="3">★★★ 3</option><option value="4">★★★★ 4</option><option value="5">★★★★★ 5</option></select>
    <select id="qmType" onchange="render()"><option value="">유형 전체</option><option value="multipleChoice">객관식</option><option value="shortAnswer">주관식</option></select>
    <select id="qmCreator" onchange="render()"><option value="">작성자 전체</option></select>
    <select id="qmSort" onchange="render()"><option value="newest">최신순</option><option value="oldest">오래된순</option><option value="difficultyDesc">난이도 높은순</option><option value="difficultyAsc">난이도 낮은순</option><option value="creator">작성자순</option><option value="prompt">문제 내용순</option></select>
    <button class="secondary" onclick="resetFilters()">초기화</button>
  </section>
  <div class="qm-summary"><span id="qmCount" class="muted"></span><span id="qmUpdated" class="muted"></span></div>
  <section id="qmList" class="qm-list"><div class="qm-empty">문제를 불러오는 중...</div></section>
</main>
<div id="qmModalBg" class="qm-modal-bg" onclick="backdropClose(event)">
  <section class="rpg-panel qm-modal" role="dialog" aria-modal="true">
    <div class="qm-head"><div><h2 id="qmModalTitle" class="rpg-title">문제 수정</h2><p class="muted">현재 문제집의 문제를 수정합니다.</p></div><button class="secondary" onclick="closeModal()">닫기</button></div>
    <div class="qm-form">
      <div><label>유형</label><label><input type="radio" name="qmEditType" value="multipleChoice" checked onchange="toggleChoices()"> 객관식</label> <label><input type="radio" name="qmEditType" value="shortAnswer" onchange="toggleChoices()"> 주관식</label></div>
      <div><label for="qmPrompt">문제 내용</label><textarea id="qmPrompt" maxlength="200"></textarea></div>
      <div id="qmChoices"><label>선택지</label><input id="qmC1" maxlength="60" placeholder="보기 1"><input id="qmC2" maxlength="60" placeholder="보기 2"><input id="qmC3" maxlength="60" placeholder="보기 3"><input id="qmC4" maxlength="60" placeholder="보기 4"></div>
      <div><label for="qmAnswer">정답</label><input id="qmAnswer" maxlength="80"></div>
      <div><label for="qmAliases">복수 정답 / 별칭</label><input id="qmAliases" maxlength="200"></div>
      <div><label for="qmExplanation">해설</label><textarea id="qmExplanation" maxlength="300"></textarea></div>
      <div class="form-grid"><div><label for="qmEditDifficulty">난이도</label><select id="qmEditDifficulty"><option value="1">★ 1</option><option value="2">★★ 2</option><option value="3">★★★ 3</option><option value="4">★★★★ 4</option><option value="5">★★★★★ 5</option></select></div><div><label for="qmSubject">과목</label><input id="qmSubject" maxlength="40"></div><div><label for="qmUnit">단원</label><input id="qmUnit" maxlength="40"></div><div><label for="qmTags">태그</label><input id="qmTags" maxlength="80"></div></div>
    </div>
    <div id="qmMessage" class="message"></div><div class="qm-modal-actions"><button class="secondary" onclick="closeModal()">취소</button><button id="qmSave" onclick="saveQuestion()">저장</button></div>
  </section>
</div>
<script>
var workbookId='',questions=[],editing=null,expanded='';
function token(){try{return sessionStorage.getItem('learningRpgAuthToken')||''}catch(e){return ''}}
function initWorkbook(){try{workbookId=sessionStorage.getItem('learningRpgSelectedWorkbookId')||''}catch(e){workbookId=''}return workbookId}
function loadQuestions(){initWorkbook();if(!token()||!workbookId){showError('로그인하거나 문제집을 먼저 선택해 주세요.');return}document.getElementById('qmList').innerHTML='<div class="qm-empty">문제를 불러오는 중...</div>';google.script.run.withSuccessHandler(function(data){questions=Array.isArray(data&&data.questions)?data.questions:[];var wb=data&&data.workbook||{};document.getElementById('qmWorkbook').textContent=(wb.workbookName||workbookId)+' · '+questions.length+'문제';buildCreators();render();document.getElementById('qmUpdated').textContent='마지막 새로고침 '+new Date().toLocaleTimeString('ko-KR')}).withFailureHandler(function(e){showError(e&&e.message||'문제를 불러오지 못했습니다.')}).getQuestionManagementData(token(),workbookId)}
function showError(s){document.getElementById('qmList').innerHTML='<div class="qm-empty">'+esc(s)+'</div>'}
function buildCreators(){var el=document.getElementById('qmCreator'),old=el.value,names={};questions.forEach(function(q){names[String(q.creatorName||'알 수 없음')]=1});el.innerHTML='<option value="">작성자 전체</option>'+Object.keys(names).sort(function(a,b){return a.localeCompare(b,'ko')}).map(function(n){return '<option value="'+attr(n)+'">'+esc(n)+'</option>'}).join('');if(names[old])el.value=old}
function render(){var s=String(document.getElementById('qmSearch').value||'').trim().toLowerCase(),d=document.getElementById('qmDifficulty').value,t=document.getElementById('qmType').value,c=document.getElementById('qmCreator').value,sort=document.getElementById('qmSort').value;var a=questions.filter(function(q){if(d&&String(q.difficulty)!==d)return false;if(t&&String(q.type)!==t)return false;if(c&&String(q.creatorName||'')!==c)return false;if(s){var h=[q.prompt,q.creatorName,q.subject,q.unit,q.tags,q.explanation].map(function(v){return String(v||'').toLowerCase()}).join(' ');if(h.indexOf(s)<0)return false}return true});a.sort(function(x,y){if(sort==='oldest')return date(x.createdAt)-date(y.createdAt);if(sort==='difficultyDesc')return Number(y.difficulty||0)-Number(x.difficulty||0)||date(y.createdAt)-date(x.createdAt);if(sort==='difficultyAsc')return Number(x.difficulty||0)-Number(y.difficulty||0)||date(y.createdAt)-date(x.createdAt);if(sort==='creator')return String(x.creatorName||'').localeCompare(String(y.creatorName||''),'ko');if(sort==='prompt')return String(x.prompt||'').localeCompare(String(y.prompt||''),'ko');return date(y.createdAt)-date(x.createdAt)});document.getElementById('qmCount').textContent=a.length+' / '+questions.length+'문제';var list=document.getElementById('qmList');if(!a.length){list.innerHTML='<div class="qm-empty">조건에 맞는 문제가 없습니다.</div>';return}list.innerHTML=a.map(item).join('')}
function item(q){var id=String(q.questionId||'');var open=id===expanded;var diff=Math.max(1,Math.min(5,Number(q.difficulty||1)));var stars='★★★★★'.split('').map(function(x,i){return '<span class="'+(i<diff?'':'muted')+'">'+x+'</span>'}).join('');var choices='';if(String(q.type)==='multipleChoice'){choices='<div class="qm-choices">'+[1,2,3,4].map(function(i){var v=q['choice'+i]||'';return '<div class="qm-choice '+(String(q.answer)===String(i)?'correct':'')+'">'+i+'. '+esc(v)+'</div>'}).join('')+'</div>'}return '<article class="qm-item '+(open?'open':'')+'"><div class="qm-row" onclick="toggleRow(\''+attr(id)+'\')"><div class="qm-main"><p class="qm-title">'+esc(q.prompt||'(문제 내용 없음)')+'</p><div class="qm-meta"><span>'+esc(q.creatorName||'알 수 없음')+'</span><span>'+esc(String(q.type)==='multipleChoice'?'객관식':'주관식')+'</span>'+ (q.subject?'<span>'+esc(q.subject)+'</span>':'')+'</div></div><div class="qm-stars" title="난이도 '+diff+'">'+stars+'</div><div class="qm-actions" onclick="event.stopPropagation()"><button class="secondary" onclick="openEdit(\''+attr(id)+'\')">수정</button><button class="secondary danger" onclick="deleteQuestion(\''+attr(id)+'\')">삭제</button></div></div><div class="qm-detail"><div class="qm-detail-grid"><div><div class="qm-label">문제</div><div class="qm-content">'+esc(q.prompt||'')+'</div><div class="qm-label" style="margin-top:14px">해설</div><div class="qm-content">'+esc(q.explanation||'해설 없음')+'</div></div><div><div class="qm-label">정답</div><div class="qm-content">'+esc(q.answer||'')+'</div><div class="qm-label" style="margin-top:14px">선택지</div>'+choices+'</div></div></div></article>'}
function toggleRow(id){expanded=expanded===id?'':id;render()}
function openEdit(id){editing=questions.find(function(q){return String(q.questionId)===String(id)});if(!editing)return;document.getElementById('qmPrompt').value=editing.prompt||'';document.getElementById('qmAnswer').value=editing.answer||'';document.getElementById('qmAliases').value=Array.isArray(editing.answerAliases)?editing.answerAliases.join(', '):(editing.answerAliases||'');document.getElementById('qmExplanation').value=editing.explanation||'';document.getElementById('qmEditDifficulty').value=String(editing.difficulty||1);document.getElementById('qmSubject').value=editing.subject||'';document.getElementById('qmUnit').value=editing.unit||'';document.getElementById('qmTags').value=editing.tags||'';[1,2,3,4].forEach(function(i){document.getElementById('qmC'+i).value=editing['choice'+i]||''});document.querySelectorAll('input[name="qmEditType"]').forEach(function(r){r.checked=r.value===String(editing.type||'multipleChoice')});toggleChoices();document.getElementById('qmMessage').textContent='';document.getElementById('qmModalBg').classList.add('open')}
function toggleChoices(){var type=document.querySelector('input[name="qmEditType"]:checked').value;document.getElementById('qmChoices').style.display=type==='multipleChoice'?'grid':'none'}
function closeModal(){document.getElementById('qmModalBg').classList.remove('open');editing=null}
function backdropClose(e){if(e.target===e.currentTarget)closeModal()}
function saveQuestion(){if(!editing)return;var type=document.querySelector('input[name="qmEditType"]:checked').value;var payload={type:type,prompt:document.getElementById('qmPrompt').value,choices:[1,2,3,4].map(function(i){return document.getElementById('qmC'+i).value}),answer:document.getElementById('qmAnswer').value,answerAliases:document.getElementById('qmAliases').value,explanation:document.getElementById('qmExplanation').value,difficulty:Number(document.getElementById('qmEditDifficulty').value),subject:document.getElementById('qmSubject').value,unit:document.getElementById('qmUnit').value,tags:document.getElementById('qmTags').value};var b=document.getElementById('qmSave');b.disabled=true;google.script.run.withSuccessHandler(function(updated){questions=questions.map(function(q){return String(q.questionId)===String(updated.questionId)?updated:q});closeModal();buildCreators();render()}).withFailureHandler(function(e){document.getElementById('qmMessage').textContent=e&&e.message||'저장하지 못했습니다.';b.disabled=false}).updateManagedQuestion(editing.questionId,payload,token(),workbookId)}
function deleteQuestion(id){var q=questions.find(function(x){return String(x.questionId)===String(id)});if(!q)return;if(!confirm('이 문제를 삭제할까요?\n\n'+String(q.prompt||'').slice(0,120)))return;google.script.run.withSuccessHandler(function(){questions=questions.filter(function(x){return String(x.questionId)!==String(id)});if(expanded===String(id))expanded='';buildCreators();render()}).withFailureHandler(function(e){alert(e&&e.message||'삭제하지 못했습니다.')}).deleteManagedQuestion(id,token(),workbookId)}
function resetFilters(){['qmSearch','qmDifficulty','qmType'].forEach(function(id){document.getElementById(id).value=''});document.getElementById('qmCreator').value='';document.getElementById('qmSort').value='newest';render()}
function goHome(){if(typeof google!=='undefined'&&google.script&&google.script.run){location.href=WEB_APP_URL+'?page=index&skipIntro=1'}else{history.back()}}
function date(v){var n=Date.parse(v||'');return isNaN(n)?0:n}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function attr(v){return esc(v)}
window.addEventListener('load',loadQuestions);document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
</script>
</body>
</html>
