<script>
(function(global) {
  'use strict';

  var DB_NAME = 'LearningRpgLocalData';
  var DB_VERSION = 2;
  var STORE_NAME = 'gameDataSnapshots';
  var SNAPSHOT_KEY = 'global';
  var SESSION_KEY = 'learningRpgGameDataSnapshot';
  var memorySnapshot = null;

  function openDatabase() {
    return new Promise(function(resolve, reject) {
      if (!global.indexedDB) {
        reject(new Error('이 브라우저는 IndexedDB를 사용할 수 없습니다.'));
        return;
      }
      var request = global.indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = function() {
        var database = request.result;
        if (!database.objectStoreNames.contains('questionSnapshots')) {
          database.createObjectStore('questionSnapshots', { keyPath: 'workbookId' });
        }
        if (!database.objectStoreNames.contains(STORE_NAME)) {
          database.createObjectStore(STORE_NAME, { keyPath: 'snapshotKey' });
        }
      };
      request.onsuccess = function() { resolve(request.result); };
      request.onerror = function() { reject(request.error || new Error('로컬 게임 데이터 저장소를 열지 못했습니다.')); };
    });
  }

  function saveSessionFallback(snapshot) {
    try {
      global.sessionStorage.setItem(SESSION_KEY, JSON.stringify(snapshot));
      return snapshot;
    } catch (error) {
      throw new Error('게임 데이터를 브라우저에 저장하지 못했습니다. 브라우저 저장소 설정을 확인해 주세요.');
    }
  }

  function loadSessionFallback() {
    try {
      var raw = global.sessionStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (error) {
      return null;
    }
  }

  function replace(snapshot) {
    snapshot = snapshot || {};
    if (!Array.isArray(snapshot.monsters) || !Array.isArray(snapshot.skills)) {
      return Promise.reject(new Error('저장할 게임 데이터가 올바르지 않습니다.'));
    }
    snapshot.snapshotKey = SNAPSHOT_KEY;
    snapshot.savedAt = Date.now();
    memorySnapshot = snapshot;
    try { global.sessionStorage.setItem(SESSION_KEY, JSON.stringify(snapshot)); } catch (error) {}
    return openDatabase().then(function(database) {
      return new Promise(function(resolve, reject) {
        var transaction = database.transaction(STORE_NAME, 'readwrite');
        transaction.objectStore(STORE_NAME).put(snapshot);
        transaction.oncomplete = function() { database.close(); resolve(snapshot); };
        transaction.onerror = function() { database.close(); reject(transaction.error || new Error('로컬 게임 데이터 저장에 실패했습니다.')); };
        transaction.onabort = transaction.onerror;
      });
    }).catch(function() {
      return saveSessionFallback(snapshot);
    });
  }

  function get() {
    if (memorySnapshot) return Promise.resolve(memorySnapshot);
    return openDatabase().then(function(database) {
      return new Promise(function(resolve, reject) {
        var transaction = database.transaction(STORE_NAME, 'readonly');
        var request = transaction.objectStore(STORE_NAME).get(SNAPSHOT_KEY);
        request.onsuccess = function() {
          database.close();
          memorySnapshot = request.result || loadSessionFallback() || null;
          resolve(memorySnapshot);
        };
        request.onerror = function() {
          database.close();
          reject(request.error || new Error('로컬 게임 데이터를 읽지 못했습니다.'));
        };
      });
    }).catch(function() {
      memorySnapshot = loadSessionFallback();
      return memorySnapshot;
    });
  }

  function clear() {
    memorySnapshot = null;
    try { global.sessionStorage.removeItem(SESSION_KEY); } catch (error) {}
    return openDatabase().then(function(database) {
      return new Promise(function(resolve, reject) {
        var transaction = database.transaction(STORE_NAME, 'readwrite');
        transaction.objectStore(STORE_NAME).clear();
        transaction.oncomplete = function() { database.close(); resolve(); };
        transaction.onerror = function() { database.close(); reject(transaction.error); };
        transaction.onabort = transaction.onerror;
      });
    }).catch(function() {});
  }

  global.LearningRpgGameDataStore = {
    replace: replace,
    get: get,
    clear: clear,
  };

  if (document.getElementById('battleShell')) {
    var guardStyle = document.createElement('style');
    guardStyle.id = 'battleFullscreenGuardStyle';
    guardStyle.textContent = '\n'
      + '#battleFullscreenGuard{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:24px;background:#000;color:#ededed;font-family:"Galmuri11","DungGeunMo","NeoDunggeunmo","Apple SD Gothic Neo","Malgun Gothic",monospace;}\n'
      + '#battleFullscreenGuard.hidden{display:none;}\n'
      + '.battle-fullscreen-guard-panel{width:min(460px,92vw);box-sizing:border-box;border:2px solid #777;background:#171717;box-shadow:inset -3px -3px 0 #080808,0 18px 50px rgba(0,0,0,.65);padding:28px 26px 24px;text-align:center;}\n'
      + '.battle-fullscreen-guard-title{margin:0 0 12px;font-size:24px;}\n'
      + '.battle-fullscreen-guard-text{margin:0 0 22px;color:#bdbdbd;line-height:1.8;}\n'
      + '.battle-fullscreen-guard-key{display:inline-flex;align-items:center;justify-content:center;min-width:74px;min-height:46px;padding:6px 12px;box-sizing:border-box;border:2px solid #ddd;border-bottom-width:4px;border-radius:3px;background:#242424;color:#f5f5f5;box-shadow:inset 0 -2px 0 #111,0 2px 0 #090909;font-family:Arial,sans-serif;font-size:17px;font-weight:800;letter-spacing:.04em;}\n'
      + '.battle-fullscreen-guard-confirm{margin-top:18px;min-width:120px;}';
    document.head.appendChild(guardStyle);

    var fullscreenGuard = document.createElement('div');
    fullscreenGuard.id = 'battleFullscreenGuard';
    fullscreenGuard.setAttribute('role', 'dialog');
    fullscreenGuard.setAttribute('aria-modal', 'true');
    fullscreenGuard.innerHTML = '\n'
      + '<section class="battle-fullscreen-guard-panel">\n'
      + '  <h2 class="battle-fullscreen-guard-title">전체화면으로 시작해 주세요</h2>\n'
      + '  <p class="battle-fullscreen-guard-text">원활한 게임 진행을 위해 브라우저를 전체화면으로 전환해야 합니다.<br>키보드의 <kbd class="battle-fullscreen-guard-key">F11</kbd>을 누르거나 아래 확인 버튼을 눌러 전체화면으로 전환해 주세요.</p>\n'
      + '  <button type="button" class="battle-fullscreen-guard-confirm" onclick="confirmBattleFullscreenGuard()">확인</button>\n'
      + '</section>';
    document.body.appendChild(fullscreenGuard);

    var pendingBattleInitialView = null;
    var fullscreenGuardHookInstalled = false;
    var fullscreenGuardPollId = null;
    var fullscreenConfirmInProgress = false;

    function isBattleFullscreen() {
      if (document.fullscreenElement) return true;
      var width = Number(global.innerWidth || 0);
      var height = Number(global.innerHeight || 0);
      var outerWidth = Number(global.outerWidth || 0);
      var outerHeight = Number(global.outerHeight || 0);
      var screenWidth = Number(global.screen && global.screen.width || 0);
      var screenHeight = Number(global.screen && global.screen.height || 0);
      var availWidth = Number(global.screen && global.screen.availWidth || 0);
      var availHeight = Number(global.screen && global.screen.availHeight || 0);
      if (!screenWidth || !screenHeight) return false;
      var innerMatchesScreen = width >= screenWidth - 2 && height >= screenHeight - 2;
      var outerMatchesScreen = outerWidth >= screenWidth - 8 && outerHeight >= screenHeight - 8;
      var viewportMatchesWorkArea = availWidth > 0 && availHeight > 0
        && width >= availWidth - 2
        && height >= availHeight - 2
        && outerHeight >= availHeight - 8
        && availHeight === screenHeight;
      return innerMatchesScreen || outerMatchesScreen || viewportMatchesWorkArea;
    }

    function stopBattleFullscreenPolling() {
      if (!fullscreenGuardPollId) return;
      global.clearInterval(fullscreenGuardPollId);
      fullscreenGuardPollId = null;
    }

    function hideBattleFullscreenGuard() {
      if (!fullscreenGuard) return;
      fullscreenGuard.classList.add('hidden');
      global.removeEventListener('resize', checkBattleFullscreen);
      document.removeEventListener('fullscreenchange', checkBattleFullscreen);
      stopBattleFullscreenPolling();
    }

    function showBattleFullscreenGuard() {
      if (!fullscreenGuard || fullscreenConfirmInProgress) return;
      fullscreenGuard.classList.remove('hidden');
    }

    function requestBattleFullscreen() {
      if (document.fullscreenElement) return Promise.resolve(true);
      var fullscreenTarget = document.documentElement || document.body;
      if (!fullscreenTarget || typeof fullscreenTarget.requestFullscreen !== 'function') {
        return Promise.resolve(false);
      }
      try {
        return Promise.resolve(fullscreenTarget.requestFullscreen({ navigationUI: 'hide' }))
          .then(function() { return true; })
          .catch(function() { return false; });
      } catch (error) {
        return Promise.resolve(false);
      }
    }

    function confirmBattleFullscreenGuard() {
      if (fullscreenConfirmInProgress) return;
      fullscreenConfirmInProgress = true;
      requestBattleFullscreen().then(function() {
        hideBattleFullscreenGuard();
        releasePendingBattleInitialView();
      });
    }

    global.confirmBattleFullscreenGuard = confirmBattleFullscreenGuard;

    function releasePendingBattleInitialView() {
      if (!pendingBattleInitialView || !global.__learningRpgApplyInitialBattleViewOriginal) return;
      var view = pendingBattleInitialView;
      pendingBattleInitialView = null;
      global.__learningRpgApplyInitialBattleViewOriginal.call(global, view);
    }

    function installBattleFullscreenGuardHook() {
      if (fullscreenGuardHookInstalled) return;
      if (typeof global.applyInitialBattleView !== 'function') {
        global.setTimeout(installBattleFullscreenGuardHook, 0);
        return;
      }
      var original = global.applyInitialBattleView;
      if (original.__learningRpgFullscreenGuardWrapped) {
        fullscreenGuardHookInstalled = true;
        return;
      }
      global.__learningRpgApplyInitialBattleViewOriginal = original;
      var wrapped = function(view) {
        if (!isBattleFullscreen()) {
          pendingBattleInitialView = view;
          showBattleFullscreenGuard();
          return;
        }
        return original.call(this, view);
      };
      wrapped.__learningRpgFullscreenGuardWrapped = true;
      global.applyInitialBattleView = wrapped;
      fullscreenGuardHookInstalled = true;
      if (isBattleFullscreen()) {
        hideBattleFullscreenGuard();
        releasePendingBattleInitialView();
      } else {
        showBattleFullscreenGuard();
      }
    }

    function checkBattleFullscreen() {
      if (isBattleFullscreen()) {
        hideBattleFullscreenGuard();
        releasePendingBattleInitialView();
      } else if (!fullscreenConfirmInProgress) {
        showBattleFullscreenGuard();
      }
    }

    global.addEventListener('resize', checkBattleFullscreen);
    document.addEventListener('fullscreenchange', checkBattleFullscreen);
    fullscreenGuardPollId = global.setInterval(checkBattleFullscreen, 200);
    installBattleFullscreenGuardHook();
    checkBattleFullscreen();
  }
})(window);
</script>
