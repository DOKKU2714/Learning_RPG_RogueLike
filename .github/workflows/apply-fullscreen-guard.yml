name: Apply fullscreen battle guard

on:
  push:
    branches:
      - feature/fullscreen-battle-guard

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Battle.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('Battle.html')
          text = path.read_text(encoding='utf-8-sig')

          marker = "    var INITIAL_BATTLE_VIEW_MAX_AGE_MS = 30000;"
          helper = r'''\

    var battleFullscreenGuardReady = false;
    var battleFullscreenGuardWaiters = [];

    function isBrowserFullscreen() {
      if (document.fullscreenElement) return true;
      var width = Number(window.innerWidth || 0);
      var height = Number(window.innerHeight || 0);
      var screenWidth = Number(window.screen && window.screen.width || 0);
      var screenHeight = Number(window.screen && window.screen.height || 0);
      return screenWidth > 0 && screenHeight > 0
        && width >= screenWidth - 2
        && height >= screenHeight - 2;
    }

    function buildBattleFullscreenGuard() {
      if (document.getElementById('battleFullscreenGuard')) return;

      var style = document.createElement('style');
      style.id = 'battleFullscreenGuardStyle';
      style.textContent = '\\
        #battleFullscreenGuard {\\
          position: fixed;\\
          inset: 0;\\
          z-index: 99999;\\
          display: grid;\\
          place-items: center;\\
          padding: 24px;\\
          background: #000;\\
          color: #ededed;\\
          font-family: "Galmuri11", "DungGeunMo", "NeoDunggeunmo", "Apple SD Gothic Neo", "Malgun Gothic", monospace;\\
        }\\
        #battleFullscreenGuard.hidden { display: none; }\\
        .battle-fullscreen-guard-panel {\\
          width: min(460px, 92vw);\\
          border: 2px solid #777;\\
          background: #171717;\\
          box-shadow: inset -3px -3px 0 #080808, 0 18px 50px rgba(0,0,0,.65);\\
          padding: 28px 26px 24px;\\
          text-align: center;\\
        }\\
        .battle-fullscreen-guard-title {\\
          margin: 0 0 12px;\\
          font-size: 24px;\\
        }\\
        .battle-fullscreen-guard-text {\\
          margin: 0 0 22px;\\
          color: #bdbdbd;\\
          line-height: 1.8;\\
        }\\
        .battle-fullscreen-guard-key {\\
          display: inline-flex;\\
          align-items: center;\\
          justify-content: center;\\
          min-width: 74px;\\
          min-height: 46px;\\
          padding: 6px 12px;\\
          border: 2px solid #ddd;\\
          border-bottom-width: 4px;\\
          background: #242424;\\
          color: #f5f5f5;\\
          box-shadow: inset 0 -2px 0 #111, 0 2px 0 #090909;\\
          font-family: Arial, sans-serif;\\
          font-size: 17px;\\
          font-weight: 800;\\
          letter-spacing: .04em;\\
        }\\
        .battle-fullscreen-guard-status {\\
          min-height: 24px;\\
          margin-top: 18px;\\
          color: #9bc9a6;\\
          font-size: 13px;\\
        }\\
      ';\\
      document.head.appendChild(style);\\

      var overlay = document.createElement('div');
      overlay.id = 'battleFullscreenGuard';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.innerHTML = '\\
        <section class="battle-fullscreen-guard-panel">\\
          <h2 class="battle-fullscreen-guard-title">전체화면으로 시작해 주세요</h2>\\
          <p class="battle-fullscreen-guard-text">\\
            원활한 게임 진행을 위해 브라우저를 전체화면으로 전환해야 합니다.<br>\\
            키보드의 <kbd class="battle-fullscreen-guard-key">F11</kbd> 키를 눌러주세요.\\
          </p>\\
          <div class="battle-fullscreen-guard-status" aria-live="polite">전체화면 전환을 기다리는 중...</div>\\
        </section>\\
      ';\\
      document.body.appendChild(overlay);
    }

    function waitForBattleFullscreen(onReady) {
      if (isBrowserFullscreen()) {
        battleFullscreenGuardReady = true;
        if (onReady) onReady();
        return;
      }

      buildBattleFullscreenGuard();
      var overlay = document.getElementById('battleFullscreenGuard');
      if (overlay) overlay.classList.remove('hidden');
      battleFullscreenGuardWaiters.push(onReady || function() {});

      function check() {
        if (!isBrowserFullscreen()) return;
        battleFullscreenGuardReady = true;
        var currentOverlay = document.getElementById('battleFullscreenGuard');
        if (currentOverlay) {
          var status = currentOverlay.querySelector('.battle-fullscreen-guard-status');
          if (status) status.textContent = '전체화면 확인 완료';
          window.setTimeout(function() {
            var latestOverlay = document.getElementById('battleFullscreenGuard');
            if (latestOverlay) latestOverlay.classList.add('hidden');
          }, 120);
        }
        var waiters = battleFullscreenGuardWaiters.splice(0);
        waiters.forEach(function(waiter) { waiter(); });
        window.removeEventListener('resize', check);
        document.removeEventListener('fullscreenchange', check);
      }

      window.addEventListener('resize', check);
      document.addEventListener('fullscreenchange', check);
      window.setTimeout(check, 0);
    }
    '''

          if marker not in text:
              raise SystemExit('fullscreen guard insertion marker not found')
          if 'function waitForBattleFullscreen(onReady)' not in text:
              text = text.replace(marker, marker + helper, 1)

          apply_marker = "    function applyInitialBattleView(view) {\n"
          apply_insert = "      if (!isBrowserFullscreen() && !battleFullscreenGuardReady) {\n        waitForBattleFullscreen(function() { applyInitialBattleView(view); });\n        return;\n      }\n"
          if apply_marker not in text:
              raise SystemExit('applyInitialBattleView marker not found')
          if apply_insert not in text:
              text = text.replace(apply_marker, apply_marker + apply_insert, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit patched file and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-fullscreen-guard.yml
          git add Battle.html .github/workflows/apply-fullscreen-guard.yml
          git commit -m "feat: require fullscreen before battle starts"
          git push origin HEAD
